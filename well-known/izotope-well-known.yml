  returned here are served BY those iZotope hosts and are scoped to iZotope's
  own shop (issuer shopify.com/authentication/73782919339; all endpoints on
  account.izotope.com) — the platform is Shopify, the tenant is iZotope. The
  /.well-known/ucp document is iZotope's own Universal Commerce Protocol
