aid: izotope
name: iZotope
description: >-
  iZotope is a Cambridge, Massachusetts audio software company founded in 2001
  that builds professional plugins for music production, audio repair, mixing,
  and mastering, with deep investments in AI-assisted and machine-learning-driven
  audio processing. Its flagship products include RX (audio restoration and
  dialogue repair widely used in film, TV, and podcast post-production), Ozone
  (mastering suite with Master Assistant), Neutron (mixing suite with Mix
  Assistant and Track Assistant), Nectar (vocal processing with Vocal
  Assistant), Tonal Balance Control (cross-session referencing), and the Music
  Production Suite bundle. iZotope's assistive technologies analyze incoming
  audio and propose starting-point chains, EQ curves, dynamics settings, and
  spectral repairs — historically among the first widely adopted AI features in
  the professional audio plugin market. iZotope announced on 2 July 2026 that it
  is joining Boris FX, leaving the Native Instruments / Soundwide group it had
  belonged to since 2024; it now sits in the Boris FX Pro Audio division
  alongside Sound Forge, Acid Pro, Sequoia, Samplitude and CrumplePop. Product
  distribution is via desktop plugin formats (VST3, AudioUnit, AAX) for DAWs
  such as Pro Tools, Logic, Ableton Live, Cubase, Studio One, and Reaper.
  iZotope publishes no OpenAPI and runs no developer platform for its DSP or
  machine-learning audio algorithms — those are licensed to OEM partners as
  contract-gated embedded SDKs. What it does operate is a real, publicly
  reachable AGENT COMMERCE surface on its own domain: an anonymous Model
  Context Protocol endpoint at https://www.izotope.com/api/ucp/mcp implementing
  the Universal Commerce Protocol (UCP 2026-04-08) with 13 catalog, cart,
  checkout and order tools carrying real JSON Schema 2020-12 input contracts,
  discoverable through /llms.txt, /agents.md and /.well-known/ucp, with OAuth
  2.0 / OpenID Connect customer accounts at account.izotope.com. The commerce
  API is the storefront for the software, not a product in its own right.
