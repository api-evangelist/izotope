apis:
  - name: iZotope Commerce Agent API (UCP / MCP)
    description: >-
      iZotope's agent-facing commerce API — an anonymous JSON-RPC 2.0 Model
      Context Protocol endpoint served on iZotope's own host implementing the
      Universal Commerce Protocol 2026-04-08. Thirteen tools cover catalog
      search and lookup, product detail, cart create/read/update/cancel,
      checkout create/read/update/complete/cancel, and order read. Every tool
      carries a real JSON Schema 2020-12 inputSchema; every call must identify
      the calling agent via meta.ucp-agent.profile; complete_checkout requires
      meta.idempotency-key and, per iZotope's own published rules, explicit
      contemporaneous buyer approval. Discoverable from /llms.txt, /agents.md
      and /.well-known/ucp. No key, no account, no plan.
    humanURL: https://www.izotope.com/agents.md
    baseURL: https://www.izotope.com/api/ucp/mcp
    tags:
